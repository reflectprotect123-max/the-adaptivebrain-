<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="hybrid-product" content="engine">
  <title>The Engine</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="logger.css">
  <link rel="stylesheet" href="library.css">
  <script src="vendor/supabase.min.js"></script>
</head>
<body>
  <div id="shell" class="shell">
    <div id="app" class="app"></div>
    <div id="fabLayer" class="fab-layer hidden">
      <div class="fab-scrim" onclick="closeFab()"></div>
      <div class="fab-menu">
        <button type="button" onclick="fabAction('goal')">Add goal</button>
        <button type="button" onclick="fabAction('session')">Create session</button>
        <button type="button" onclick="fabAction('coach')">Talk to coach</button>
      </div>
      <button type="button" class="fab" aria-label="Add" onclick="toggleFab(event)">+</button>
    </div>
    <div id="coachSheet" class="coach-sheet hidden" aria-hidden="true">
      <div class="coach-sheet-backdrop" onclick="closeCoachSheet()"></div>
      <div class="coach-sheet-panel">
        <div class="coach-sheet-head">
          <strong>Talk to coach</strong>
          <button type="button" class="icon-btn" onclick="closeCoachSheet()" aria-label="Close">×</button>
        </div>
        <div class="coach-log" id="coachSheetLog"></div>
        <div class="coach-compose">
          <textarea id="coachSheetInput" rows="2" placeholder="Ask about today’s training…"></textarea>
          <button type="button" class="btn primary" onclick="askCoach()">Send</button>
        </div>
        <p class="stub" id="coachSheetStatus"></p>
      </div>
    </div>
    <div id="logger" class="hidden"></div>
    <nav class="bottom-nav" id="bottomNav">
      <button type="button" data-tab="home" onclick="setTab('home')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
        <span>Home</span>
      </button>
      <button type="button" data-tab="training" onclick="setTab('training')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2V3H7zm0 4h10v10H7V7z"/></svg>
        <span>Training</span>
      </button>
      <button type="button" data-tab="library" onclick="setTab('library')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h11a2 2 0 0 1 2 2v13H8a2 2 0 0 1-2-2V4zm2 14h9V6H8v12zM4 6h1v14H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/></svg>
        <span>Library</span>
      </button>
      <button type="button" data-tab="me" onclick="setTab('me')">
        <img class="nav-me-logo" src="assets/hpp-logo.jpg" width="22" height="22" alt="">
        <span>Me</span>
      </button>
    </nav>
  </div>
  <script src="engine-config.js"></script>
  <script src="adaptive-bundle.js"></script>
  <script src="brain-bundle.js"></script>
  <script src="brain-kernel.js"></script>
  <script src="native-bridge.js"></script>
  <script src="connectors/whoop.js"></script>
  <script src="session.js"></script>
  <script src="engine.js"></script>
  <script src="library.js"></script>
  <script src="library-ui.js"></script>
  <script src="timer.js"></script>
  <script src="logger.js"></script>
  <script src="app.js"></script>
</body>
</html>
