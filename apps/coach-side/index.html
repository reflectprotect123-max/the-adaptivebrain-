}

-weight:820;letter-spacing:-.02em}.pill{padding:5px 8px;border:1px solid #b68a5070;border-radius:999px;color:var(--gold2);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.pill.ok{border-color:#9cb48b80;color:var(--ok)}.pill.warn{border-color:#d4a35b80;color:var(--warn)}.pill.bad{border-color:#cb817480;color:var(--bad)}.btn{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);font-weight:760;min-height:var(--tap-min)}.btn.primary{border-color:var(--gold);background:var(--gold);color:#14110d}.btn.ghost{background:transparent}.btn.danger{border-color:#cb817466;color:#e7a59a}.btn.small{padding:7px 9px;font-size:12px;min-height:var(--tap-min)}.btn.block{width:100%}.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{display:grid;gap:6px;margin-top:11px}.field label{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}input,textarea,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:#0d0d0d;color:var(--text)}textarea{min-height:140px;resize:vertical;line-height:1.45;white-space:pre-wrap;overflow:auto}.openbox{min-height:140px;width:100%;line-height:1.45;white-space:pre-wrap;overflow:auto}.openbox.tall{min-height:170px}.openbox.previewtext{margin-top:10px;background:#0d0d0d;color:var(--text)}.openbox[readonly]{color:var(--text);opacity:.92}input:focus-visible,textarea:focus-visible,select:focus-visible{border-color:var(--gold)}.divider{height:1px;margin:13px 0;background:var(--line)}.empty{padding:30px 17px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--muted);text-align:center}.empty b{display:block;margin-bottom:7px;color:var(--text)}.notice{padding:11px;border:1px solid #b68a5055;border-radius:12px;background:#b68a5015;color:#e8d4b7;font-size:12px;line-height:1.45}

.checkin-step{margin-top:8px}

.savestatus{padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#111;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.savestatus.ok{border-color:#9cb48b66;color:var(--ok)}.savestatus.saving{border-color:#d4a35b66;color:var(--warn)}.savestatus.bad{border-color:#cb817466;color:var(--bad)}.autosavecard{border-color:#9cb48b55;background:linear-gradient(180deg,#121812,#101010)}.autosavegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}@media(max-width:420px){.autosavegrid{grid-template-columns:1fr}.topright{gap:6px}.savestatus{font-size:9px;padding:6px 7px}}
.saveflash{margin-top:10px;color:var(--gold2);font-size:12px;text-align:center}.editgrid{display:grid;gap:8px}.editrow{display:grid;grid-template-columns:34px 1fr 1fr .75fr auto;gap:7px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}.editrow:last-child{border:0}@media(max-width:420px){.editrow{grid-template-columns:30px 1fr 1fr .65fr auto;gap:5px}.setrow{grid-template-columns:30px repeat(4,minmax(44px,1fr)) auto;gap:5px}.editrow input,.setrow input{padding:9px 7px}.nav button{font-size:9px}.sliderhead b{font-size:16px}}

.programgrid{display:grid;gap:12px}.programcard{border-left:3px solid var(--gold)}.programslots{display:grid;gap:8px;margin-top:12px}.programslot{padding:11px;border:1px solid var(--line);border-radius:14px;background:#0e0e0e}.slothead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.programmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.programmeta .stat{min-height:auto}.programchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.programchip{padding:6px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px}.programchip.gold{border-color:#b68a5070;color:var(--gold2)}.systemhero{border-color:#b68a5080;background:radial-gradient(circle at 20% 0%,#3a271055,transparent 38%),linear-gradient(180deg,#18120c,#101010)}.systemhero h2{font-size:28px;line-height:1.02}.flowsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.flowstep{padding:11px;border:1px solid #b68a503d;border-radius:14px;background:#0c0c0c}.flowstep b{display:block;color:var(--gold2);font-size:12px;letter-spacing:.08em;text-transform:uppercase}.flowstep span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}.workshopnote{border:1px dashed var(--line2);background:#0d0d0d}.programbigactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}@media(max-width:520px){.flowsteps,.programbigactions{grid-template-columns:1fr}}.reviewgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.reviewitem{padding:10px;border:1px solid var(--line);border-radius:12px;background:#0e0e0e;text-align:center}.reviewitem b{display:block;font-size:20px}.reviewitem span{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.stepgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stepitem{padding:10px;border:1px solid var(--line);border-radius:12px;background:#0e0e0e}.stepitem b{display:block;font-size:12px}.stepitem span{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.35}.advancedbar{margin-top:14px}.helper{color:var(--muted);font-size:11px;line-height:1.35}.checkrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin-top:12px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#0e0e0e}.checkrow input{width:auto;margin-top:3px}.checkrow span{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.35}.librarytop{display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:520px){.programmeta,.reviewgrid,.stepgrid{grid-template-columns:1fr 1fr}.librarytop{display:grid}.slothead{display:grid}}
.streamhero{padding:18px;border:1px solid var(--line2);border-radius:var(--r-lg);background:var(--panel);box-shadow:none}
.streamhero.dial-strength{border-color:rgba(212,165,116,.35);border-left:3px solid var(--copper)}

.quickgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2);margin-top:13px}.quickgrid .btn{min-height:48px}
.library-starter-row{display:grid;grid-template-columns:1fr;gap:var(--space-2);margin-top:var(--space-3);max-width:280px}

.block-collapsed{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel3);cursor:pointer;text-align:left;width:100%;min-height:var(--tap-min)}
.block-collapsed .meta{margin-top:4px;font-size:12px}
.home-brief{margin-top:var(--space-3);padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.home-brief .meta{margin-top:6px}
.settings-group{display:grid;gap:var(--space-3);margin-top:18px;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.cal-head{margin-top:var(--space-3);margin-bottom:var(--space-2)}
.cal-week-label{margin:10px 0 0;color:var(--muted);font-size:12px;letter-spacing:.04em;text-align:center}
.cal-sessions{display:grid;gap:var(--space-2)}
.cal-day-count{display:block;margin-top:2px;font-size:10px;font-weight:700;color:var(--copper2);letter-spacing:.04em}
.cal-day-label{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.88;line-height:1.1}
.cal-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}

.cal-empty{padding:14px 16px;border:1px dashed var(--line2);border-radius:14px;background:var(--panel3);text-align:center}

.day.today{box-shadow:inset 0 0 0 1px rgba(94,196,180,.35)}

.ath-cal-month{margin-top:8px}

.ath-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

  display:flex;flex-direction:column;align-items:stretch;

/* ========== Athlete UI polish — Track Dawn (tokens in single :root above) ========== */
html{background:var(--bg-deep);color-scheme:dark;scrollbar-color:#4a5560 var(--bg-deep);scrollbar-width:thin;scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top))}
html{
  height:auto;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
body{
  min-height:100svh;
  color:var(--text);
  font-family:var(--font-body);
  font-weight:450;
  letter-spacing:-.011em;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior-y:auto;
  touch-action:pan-y;
  background:
    radial-gradient(ellipse 90% 55% at 50% -8%, rgba(212,165,116,.11), transparent 55%),
    radial-gradient(ellipse 70% 40% at 100% 10%, rgba(94,196,180,.06), transparent 45%),
    radial-gradient(ellipse 50% 30% at 0% 80%, rgba(212,165,116,.04), transparent 40%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(212,165,116,.28);color:var(--text)}
button,a,input,textarea,select,[onclick],.day,.nav button,.ath-module{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.day:focus-visible,.nav button:focus-visible,.ath-module:focus-visible,.btn:focus-visible,.expandhead:focus-visible,.weekhead:focus-visible,.searchpick:focus-visible,.block-collapsed:focus-visible,.close:focus-visible{
  outline:none; box-shadow:var(--focus);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

.app,.shell{
  position:relative; isolation:isolate;
  max-width:760px; margin:0 auto; min-height:100svh;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.top,.header{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  min-height:64px;
  padding:12px 16px calc(12px);
  padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
  background:rgba(10,12,14,.82);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  backdrop-filter:blur(18px) saturate(140%);
}
.brand{display:flex; gap:12px; align-items:center}
.mark{
  display:grid; place-items:center;
  width:42px; height:42px;
  border:1px solid rgba(212,165,116,.55);
  border-radius:13px;
  color:var(--copper2);
  font-family:var(--font-display);
  font-weight:700; font-size:13px; letter-spacing:.14em;
  background:linear-gradient(145deg, rgba(212,165,116,.16), rgba(94,196,180,.05));
  box-shadow:inset 0 1px rgba(255,255,255,.06);
}
.brand b, .brand > div > b{
  display:block; font-family:var(--font-display);
  font-size:18px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
}
.brand small{
  display:block; margin-top:2px;
  color:var(--dim); font-size:10px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase;
}
main, #appScreen, .screen{
  padding:22px 16px 28px;
}
.eyebrow,.kicker{
  margin:0 0 8px;
  color:var(--copper2);
  font-family:var(--font-display);
  font-size:12px; font-weight:600;
  letter-spacing:.18em; text-transform:uppercase;
}
h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:.01em}
h1{font-size:clamp(28px,7vw,34px); line-height:1.02; letter-spacing:.005em}
h2{font-size:clamp(22px,5.5vw,26px); line-height:1.1}
.lead,.meta{color:var(--muted); font-size:14px; line-height:1.5; font-weight:400}
.lead{margin-top:8px; max-width:36ch}
.stack{display:grid; gap:14px; margin-top:18px}

/* Surfaces — card chrome */
.card,.streamhero,.weekbox,.toolcard,.anchorcard,.programcard,.systemhero{
  padding:16px 16px 15px;
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  background:
    linear-gradient(165deg, rgba(24,29,34,.96), rgba(14,18,22,.98));
  box-shadow:inset 0 1px rgba(255,255,255,.035);
}
.card.soft,.simplecard{box-shadow:none; background:var(--panel3)}
.systemhero,.streamhero{
  border-color:rgba(212,165,116,.28);
  background:
    linear-gradient(145deg, rgba(212,165,116,.1), transparent 42%),
    linear-gradient(165deg, rgba(24,29,34,.98), rgba(12,16,20,.99));
}
.title{font-weight:600; letter-spacing:-.015em; line-height:1.25}
.pill,.programchip{
  display:inline-flex; align-items:center;
  padding:5px 9px; border-radius:999px;
  border:1px solid rgba(212,165,116,.28);
  background:var(--copper-dim);
  color:var(--copper2);
  font-size:10px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;
}
.pill.ok{border-color:rgba(125,186,154,.35); color:var(--ok); background:rgba(125,186,154,.1)}
.pill.warn{border-color:rgba(212,163,91,.35); color:var(--warn); background:rgba(212,163,91,.1)}
.pill.bad{border-color:rgba(208,137,125,.35); color:var(--bad); background:rgba(208,137,125,.1)}

.btn, button.btn, .btns .btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px; min-width:44px;
  padding:11px 14px;
  border:1px solid var(--line2);
  border-radius:13px;
  background:linear-gradient(180deg, #1c2228, #151a1f);
  color:var(--text);
  font-family:var(--font-body);
  font-weight:600; font-size:14px;
  letter-spacing:-.01em;
  box-shadow:inset 0 1px rgba(255,255,255,.04);
  transition:border-color .16s var(--ease), background .16s var(--ease), transform .12s var(--ease), box-shadow .16s var(--ease);
}
.btn.primary, button.btn.primary, .btn.block.primary{
  border-color:rgba(212,165,116,.65);
  background:linear-gradient(180deg, #e0b888, #c89458);
  color:#14110d;
  box-shadow:inset 0 1px rgba(255,255,255,.28), 0 8px 22px rgba(120,80,30,.22);
}
.btn.ghost{background:transparent; box-shadow:none}
.btn.danger,.btn.bad{border-color:rgba(208,137,125,.4); color:#f0b4aa; background:rgba(208,137,125,.06)}
.btn.small{min-height:var(--tap-min); min-width:var(--tap-min); padding:10px 12px; font-size:13px; border-radius:11px}
.btn.block{width:100%}
.btn,button.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
@media(hover:hover){
  .btn:hover{border-color:rgba(212,165,116,.35); background:linear-gradient(180deg,#232a31,#191e24)}
  .btn.primary:hover{border-color:#e8c49a; background:linear-gradient(180deg,#e8c49a,#d4a574); transform:translateY(-1px)}
  .btn:active,.btn.primary:active{transform:translateY(0)}
}

input,textarea,select{
  width:100%; min-height:44px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0b0e11;
  color:var(--text);
  font-family:var(--font-body);
}
input:focus,textarea:focus,select:focus{border-color:rgba(212,165,116,.55); box-shadow:var(--focus)}
.field label{
  color:var(--muted); font-size:10px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase;
}

/* Home athlete modules — signature effort panes */
.ath-session{padding:2px 0 6px}
.ath-date,.ath-session > .ath-date{
  margin:0 0 14px;
  font-family:var(--font-display);
  font-size:clamp(26px,7vw,32px);
  font-weight:700;
  letter-spacing:.02em;
  line-height:1;
  color:var(--text);
}
.ath-athlete{display:flex; gap:12px; align-items:center; margin-bottom:18px}
.ath-avatar,.ath-flash-wrap{
  width:48px; height:48px; border-radius:50%;
  display:grid; place-items:center; flex-shrink:0;
  border:1px solid rgba(94,196,180,.35);
  background:radial-gradient(circle at 30% 25%, rgba(94,196,180,.22), rgba(18,22,26,.9));
  color:var(--zone);
}
.ath-name{margin:0; color:var(--zone); font-size:14px; font-weight:600; letter-spacing:.02em}
.ath-workout{margin:3px 0 0; color:var(--text); font-family:var(--font-display); font-size:22px; font-weight:600; letter-spacing:.02em; line-height:1.05}
.ath-module{
  display:flex; align-items:center; gap:12px;
  width:100%;
  min-height:72px;
  padding:14px 14px;
  margin:0 0 12px;
  border-radius:18px;
  border:1px solid rgba(212,165,116,.22);
  background:
    linear-gradient(120deg, rgba(212,165,116,.1), transparent 46%),
    linear-gradient(165deg, rgba(24,29,34,.95), rgba(12,16,20,.98));
  color:inherit; font:inherit; text-align:left;
  box-shadow:inset 0 1px rgba(255,255,255,.04);
  transition:border-color .16s var(--ease), transform .12s var(--ease), background .16s var(--ease);
}
.ath-module:last-child{margin-bottom:0}
.ath-module.static{cursor:default}
@media(hover:hover){
  .ath-module:not(.static):hover{
    border-color:rgba(94,196,180,.4);
    transform:translateY(-1px);
    background:
      linear-gradient(120deg, rgba(94,196,180,.1), transparent 50%),
      linear-gradient(165deg, rgba(26,32,38,.98), rgba(12,16,20,.99));
  }
}
.ath-label{
  width:86px; flex-shrink:0;
  color:var(--copper2);
  font-family:var(--font-display);
  font-size:13px; font-weight:700;
  letter-spacing:.14em; line-height:1.15;
}
.ath-module[aria-label*="Conditioning" i] .ath-label,
.ath-module:nth-of-type(2) .ath-label{color:var(--zone)}
.ath-legend{flex:1; display:flex; flex-direction:column; gap:6px}
.ath-row{display:flex; align-items:center; gap:8px}
.ath-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.ath-ll{color:var(--muted); font-size:12px; font-weight:500; min-width:64px}
.ath-lv{color:var(--text); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}
.ath-chev{color:var(--dim); font-size:18px; margin-left:4px}
.ath-cond{flex:1; display:flex; flex-direction:column; gap:8px}
.ath-hint{margin:0; color:var(--dim); font-size:11px; font-weight:500}
.ath-zbar{height:12px; border-radius:999px; overflow:hidden; display:flex; background:rgba(0,0,0,.35)}
.ath-zn{color:var(--muted); font-size:12px; font-weight:500; min-width:32px}
.ath-zr{color:var(--dim); font-size:11px; font-weight:500; margin-left:auto}
.ath-zt,.mph-ztime{color:var(--text); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}

/* Nav */
.nav,#bottomNav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  border-top:1px solid var(--line);
  background:rgba(7,9,11,.9);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  backdrop-filter:blur(18px) saturate(140%);
}
.navin,.nav .navin,#bottomNav .navin{
  display:grid; grid-template-columns:repeat(4,1fr);
  max-width:760px; margin:0 auto;
  padding:6px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav button,#bottomNav button{
  display:grid; place-items:center; gap:4px;
  min-height:52px;
  border:0; background:transparent;
  color:var(--dim);
  font-family:var(--font-body);
  font-size:10px; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase;
  border-radius:14px;
  transition:color .16s var(--ease), background .16s var(--ease);
}
.nav button.active,#bottomNav button.active{
  color:var(--copper2);
  background:rgba(212,165,116,.08);
}
.nav svg,#bottomNav svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7}

/* Calendar week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
.day{
  display:grid;place-items:center;align-content:center;gap:2px;
  min-height:58px;padding:8px 4px;
  border:1px solid var(--line);border-radius:14px;
  background:var(--panel3);color:var(--muted);text-align:center;
  font-size:11px;font-weight:500;
  transition:border-color .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease);
}
.day b{display:block;margin-top:2px;color:var(--text);font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1}
.day.active{border-color:var(--gold);background:rgba(212,165,116,.16);color:var(--copper2);box-shadow:0 0 0 2px rgba(212,165,116,.35)}
.day.active b{color:var(--gold2)}
.day.has:after{display:block;width:6px;height:6px;margin:4px auto 0;border-radius:50%;background:var(--zone);content:""}

/* Library tabs (Strength | The Engine) */
.library-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 14px;padding:4px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.25)}
.library-tab{min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.library-tab.active{color:var(--text);background:rgba(212,165,116,.14);box-shadow:inset 0 0 0 1px rgba(212,165,116,.35)}
.library-tab.engine.active{background:rgba(94,196,180,.14);box-shadow:inset 0 0 0 1px rgba(94,196,180,.4);color:#9fe8dc}
.library-tab.progress.active{background:rgba(182,138,80,.14);box-shadow:inset 0 0 0 1px rgba(182,138,80,.4);color:var(--gold2)}
.coach-strength-coach-msg{display:none}
.coach-rx-active .coach-strength-coach-msg{display:block}
.coach-rx-active .ath-strength-build-coach-note{display:block}
.ath-strength-build-coach-note{display:none;margin-top:10px}
.streamhero.dial-engine{border-color:rgba(94,196,180,.35);border-left:3px solid var(--zone)}
.ath-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0;padding:4px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.25)}
.ath-tab{min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;font-weight:700;cursor:pointer}
.ath-tab.active{color:var(--text);background:rgba(212,165,116,.14);box-shadow:inset 0 0 0 1px rgba(212,165,116,.35)}
/* Library hero */
.streamhero,.systemhero{
  padding:18px 16px;
}
.streamhero h2,.systemhero h2{
  margin:6px 0 0;
  font-family:var(--font-display);
  font-size:clamp(26px,6.5vw,32px);

}
.quickgrid,.quickgrid{display:grid; grid-template-columns:1fr; gap:8px; margin-top:14px}
@media(min-width:420px){.quickgrid{grid-template-columns:1fr 1fr}}


/* Cond thin twin — Easy/Medium/Hard */
.mph-planline{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
.mph-planline b{color:var(--text);font-weight:650}
.mph-efforts{display:flex;gap:6px;margin-top:8px}
.mph-eff{
  flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--line);
  background:#0e1216;text-align:center;font-size:12px;font-weight:700;color:var(--text);
  font-family:inherit;cursor:pointer;min-height:44px;
}
.mph-eff small{display:block;margin-top:3px;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85;color:inherit}
.mph-eff.easy{border-color:rgba(51,196,255,.35);color:#33c4ff}
.mph-eff.medium{border-color:rgba(61,255,158,.35);color:#3dff9e}
.mph-eff.hard{border-color:rgba(255,91,87,.35);color:#ff8f8c}
.mph-eff.easy.on{border-color:rgba(51,196,255,.75);background:rgba(51,196,255,.12)}
.mph-eff.medium.on{border-color:rgba(61,255,158,.75);background:rgba(61,255,158,.12)}
.mph-eff.hard.on{border-color:rgba(255,91,87,.7);background:rgba(255,91,87,.12)}
.mph-bands{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:10px}
.mph-band{padding:7px 6px;border-radius:10px;border:1px solid var(--line);background:#0e1216;text-align:center}
.mph-band.on{background:rgba(61,255,158,.1)}
.mph-band b{display:block;font-size:11px}
.mph-band span{display:block;margin-top:2px;font-size:9px;color:var(--muted)}
.mph-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.mph-strip.two{grid-template-columns:1fr 1fr}
.mph-cell{padding:8px;border:1px solid var(--line);border-radius:11px;background:#0e1216}
.mph-cell small{display:block;color:var(--muted);font-size:8px;letter-spacing:.1em;text-transform:uppercase}
.mph-cell b{display:block;margin-top:2px;font-size:16px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mph-cell .was{display:block;margin-top:1px;color:var(--dim);font-size:10px}
.mph-twin-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mph-twin-fields .field{margin-top:0}
.mph-hint{margin-top:8px;color:var(--dim);font-size:11px;line-height:1.35}
.mph-iv-phase{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;gap:10px}
.mph-iv-phase .lab .mph-eye{margin:0}
.mph-iv-phase .lab b{font-family:var(--font-display);font-size:26px}
.mph-iv-count{font-size:34px;font-weight:800;letter-spacing:-.05em;color:var(--copper2);font-variant-numeric:tabular-nums}
.mph-rounds{margin-top:8px;display:grid;gap:4px}
.mph-round{
  display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;
  padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:#0e1216;font-size:11px;
}
.mph-round.on{border-color:rgba(255,91,87,.45);background:rgba(255,91,87,.08)}
.mph-round.done{opacity:.5}
.mph-round .n{color:var(--copper2);font-weight:800}

/* Conditioning runtime — The Engine slate */
.mph-back{
  min-height:44px; margin-bottom:10px; padding:8px 0;
  border:0; background:transparent; color:var(--copper2);
  font-weight:600; font-size:14px;
}
.mph-hero{
  padding:16px 14px 14px;
  border:1px solid rgba(212,165,116,.28);
  border-radius:18px;
  background:
    radial-gradient(ellipse at 18% 0%, rgba(61,255,158,.08), transparent 42%),
    radial-gradient(ellipse at 88% 8%, rgba(51,196,255,.07), transparent 40%),
    linear-gradient(180deg, #14110d, #0c0c0c);
}
.mph-eye{
  margin:0 0 6px;
  color:var(--copper2);
  font-size:12px; font-weight:800;
  letter-spacing:.14em; text-transform:uppercase;
}
.mph-hero h2{
  margin:0;
  font-family:var(--font-display);
  font-size:clamp(28px,7vw,34px);
  letter-spacing:.02em; line-height:1;
}
.mph-copy{
  margin:8px 0 0;
  color:var(--muted);
  font-size:13px; line-height:1.45;
}
.mph-gauge-wrap{margin-top:8px}
.mph-hr-readout{
  display:flex; align-items:baseline; justify-content:center;
  gap:10px; margin-top:-6px;
}
.mph-hr-readout b{
  font-family:var(--font-display);
  font-size:42px; font-weight:700; letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.mph-hr-readout b small{
  margin-left:4px; color:var(--dim);
  font-size:14px; font-weight:600; letter-spacing:.08em;
}
.mph-hr-readout span{font-size:13px; font-weight:700}
.mph-hr-status,.mph-guide{
  margin:8px 0 0;
  color:var(--dim);
  font-size:12px; line-height:1.4;
}
.mph-zone{
  margin-top:8px; padding:11px 12px;
  border:1px solid var(--line); border-radius:14px;
  background:rgba(8,10,12,.55);
  transition:border-color .18s ease, background .18s ease;
}
.mph-zone.on{
  border-color:rgba(212,165,116,.55);
  background:rgba(212,165,116,.1);
}
.mph-bpm{
  display:block; margin-top:4px;
  color:var(--dim); font-size:12px; font-weight:600;
  font-variant-numeric:tabular-nums;
}
.mph-compact{margin-top:12px}
.mph-compact-meta{
  display:flex; align-items:center; gap:8px;
  margin-top:8px; color:var(--text); font-size:13px; font-weight:650;
}
.mph-compact-meta .ath-dot{width:8px; height:8px}
.mph-compact-meta span.muted{color:var(--muted); font-weight:500}
.mph-build{
  margin-top:14px; padding:15px 14px 18px;
  border:1px solid var(--line); border-radius:18px;
  background:linear-gradient(180deg, var(--panel), #101010);
}
.mph-build .title{
  font-family:var(--font-display);
  font-size:22px; letter-spacing:.02em;
}
.mph-lab{
  display:block; margin:14px 0 8px;
  color:var(--dim);
  font-size:12px; font-weight:800;
  letter-spacing:.12em; text-transform:uppercase;
}
.mph-chips{display:flex; flex-wrap:wrap; gap:8px}
.mph-chip{
  min-height:44px; min-width:44px; padding:10px 14px;
  border:1px solid var(--line2); border-radius:999px;
  background:#0d0d0d; color:var(--muted);
  font-size:13px; font-weight:650; white-space:nowrap;
  transition:border-color .18s ease, background .18s ease, color .18s ease;
}
.mph-chip.on{
  border-color:rgba(212,165,116,.65);
  background:rgba(212,165,116,.14);
  color:var(--copper2);
}
.mph-chip:focus-visible,.mph-step:focus-visible,.mph-back:focus-visible,
.ath-sticky .btn:focus-visible{
  outline:2px solid var(--copper2);
  outline-offset:2px;
}
.ath-sticky{
  position:sticky; bottom:0; z-index:25;
  display:grid; gap:8px;
  margin:16px -4px 0; padding:12px 4px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:rgba(7,9,11,.94);
  backdrop-filter:blur(12px);
}
.ath-sticky.dual{grid-template-columns:1fr 1fr}
.ath-sticky .btn{min-height:48px}

.mph-mins{
  display:flex; align-items:center; justify-content:center;
  gap:16px; margin-top:4px;
}
.mph-mins b{
  min-width:64px; text-align:center;
  font-family:var(--font-display);
  font-size:36px; font-weight:700;
  font-variant-numeric:tabular-nums;
}
.mph-step{
  width:44px; height:44px; padding:0;
  border:1px solid var(--line2); border-radius:50%;
  background:#0d0d0d; color:var(--text);
  font-size:22px; line-height:1;
}
.mph-adv{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  margin-top:4px;
  animation:mphAdvIn .28s cubic-bezier(.22,1,.36,1) both;
}
.mph-adv .field{margin-top:0}
.mph-adv input{
  text-align:center; font-variant-numeric:tabular-nums;
  min-height:44px;
}
@keyframes mphAdvIn{
  from{opacity:0; transform:translateY(6px)}
  to{opacity:1; transform:none}
}
.mph-derived{
  margin:14px 0 0; padding:10px 12px;
  border:1px solid rgba(212,165,116,.28);
  border-radius:12px;
  background:rgba(212,165,116,.08);
  color:#e8d4b7;
  font-size:12px; line-height:1.45;
}
.mph-derived b{color:var(--copper2)}
.mph-shell{padding-bottom:12px}
/* Engine dial uses shared .ath-sticky */
@media (prefers-reduced-motion: reduce){
  .mph-chip,.mph-zone{transition:none}
  .mph-adv{animation:none}
  .shell-screen{animation:none}
}
.bigtime,.mph-gauge b{
  font-family:var(--font-display);
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}

.stat{padding:12px; border:1px solid var(--line); border-radius:14px; background:rgba(8,10,12,.5)}
.stat small{display:block; color:var(--muted); font-size:9px; letter-spacing:.12em; text-transform:uppercase}
.stat b{display:block; margin-top:4px; font-family:var(--font-display); font-size:26px; letter-spacing:.01em}

.savestatus,.savestatus{
  padding:7px 10px; border:1px solid var(--line); border-radius:999px;
  background:rgba(14,18,22,.9); color:var(--muted);
  font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
}
.savestatus.ok{border-color:rgba(125,186,154,.4); color:var(--ok)}

details.card > summary{
  cursor:pointer; list-style:none;
  font-family:var(--font-display); font-size:18px; font-weight:600; letter-spacing:.02em;
}
details.card > summary::-webkit-details-marker{display:none}

@media(min-width:680px){
  main,#appScreen{padding:26px 22px 36px}
}

.nut-meal{margin-top:8px !important;padding:10px 12px !important}

.ath-module[aria-label*="Nutrition" i] .nut-home-summary{font-size:13px;font-weight:650;color:var(--text);font-variant-numeric:tabular-nums}

/* v43 medium Track Dawn punch */
html{background:
  radial-gradient(1200px 600px at 10% -10%, rgba(212,165,116,.09), transparent 55%),
  radial-gradient(900px 500px at 110% 0%, rgba(94,196,180,.07), transparent 50%),

function athTodayZoneSeconds(){let out=emptyZoneSeconds(),day=today();
  for(const x of (S.sessions||[])){
    if(x.date!==day)continue;
    if(!(x.status==='completed'||x.status==='active'||x.id===S.active))continue;
    for(const t of (x.tasks||[])){
      if(t.kind!=='conditioning')continue;
      out=mergeZoneSeconds(out,taskZoneSeconds(t));
    }
  }
  // live in-progress on bleHr (not yet flushed)
  if(simpleCondLog) out=mergeZoneSeconds(out,bleHr.zoneSeconds);
  return out;
}
function athZoneSecondsTotal(zs){zs=zs||{};return Object.values(zs).reduce((a,v)=>a+num(v),0)}
function tickCondZoneSeconds(bpm){
  if(!simpleCondLog)return;
  let t=current(); if(!t||t.kind!=='conditioning')return;
  // Count time while the block clock is running OR as soon as strap stream has started
  let clockOn=!!(t.blockTimer&&t.blockTimer.on);
  let streaming=!!bleHr.startedAt;
  if(!clockOn&&!streaming)return;
  let now=Date.now();
  if(bleHr.lastZoneAt){
    let dt=Math.min(5,Math.max(0,(now-bleHr.lastZoneAt)/1000));
    if(dt>0){
      let zones=athZonesForReadiness(athHomeMetrics().recovery);
      let key=(false&&EngineAdapter.zoneKeyForBpm)?EngineAdapter.zoneKeyForBpm(bpm,zones):((mphZoneForHr(bpm,zones)||{}).key||'recovery');
      bleHr.zoneSeconds=bleHr.zoneSeconds||emptyZoneSeconds();
      bleHr.zoneSeconds[key]=num(bleHr.zoneSeconds[key])+dt;
      t.result=t.result||{};
      t.result.zoneSeconds=mergeZoneSeconds(t.result.zoneSeconds, {});
      // keep task copy in sync with live totals for this block
      t.result.zoneSeconds=Object.assign(emptyZoneSeconds(), bleHr.zoneSeconds);
      let el=$('mphZoneTime_'+key); if(el) el.textContent=formatZoneClock(bleHr.zoneSeconds[key]);
      let homeEl=$('athZoneTime_'+key); if(homeEl) homeEl.textContent=formatZoneClock(athTodayZoneSeconds()[key]);
    }
  }
  bleHr.lastZoneAt=now;
}
