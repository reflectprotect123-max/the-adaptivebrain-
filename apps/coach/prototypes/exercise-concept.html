<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lower Strength — Exercises</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --void: #000000;
    --surface: #121212;
    --raised: #1c1c1e;
    --ink: #ffffff;
    --muted: #8e8e93;
    --line: rgba(255, 255, 255, 0.1);
    --blue: #1ba3ff;
    --copper: #d4a574;
    --danger: #ff6b6b;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); }
  body {
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  h1, h2, p { margin: 0; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }

  .app {
    height: 100%;
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr);
    background: var(--void);
  }

  .rail {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 12px 8px;
    border-right: 1px solid var(--line);
    background: var(--void);
  }
  .mark {
    width: 36px;
    height: 36px;
    margin-bottom: 12px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: #fff;
    color: #111;
    font-family: var(--body);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .rail button {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: rgba(255, 255, 255, 0.5);
  }
  .rail button.on { background: rgba(255, 255, 255, 0.12); color: #fff; }
  .rail svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .rail .foot { margin-top: auto; }

  .work { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .header {
    height: 56px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 22px 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .header h1 {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1;
  }
  .header-actions { display: flex; align-items: center; gap: 14px; }
  .who { color: var(--muted); font-size: 13px; font-weight: 500; }
  .next {
    min-height: 40px;
    padding: 0 18px;
    border-radius: 12px;
    background: var(--blue);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
  }

  .desk {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
  }

  .spine {
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 18px 14px 16px;
    border-right: 1px solid var(--line);
  }
  .spine-kicker {
    margin: 0 8px 10px;
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .lift {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr);
    column-gap: 10px;
    align-items: center;
    width: 100%;
    text-align: left;
    padding: 10px 10px;
    border-radius: 12px;
  }
  .lift.is-on { background: var(--surface); box-shadow: inset 2px 0 0 var(--blue); }
  .disc {
    width: 32px;
    height: 32px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    background: #3a3a3c;
    font-family: var(--display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .disc.pair-disc { font-size: 14px; }
  .lift.is-on .disc { background: var(--copper); color: #141210; }
  .lift b {
    display: block;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .lift small {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .lift.is-on small { color: var(--blue); }

  .pair { display: flex; flex-direction: column; }
  .link {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 16px;
    margin-left: 24px;
  }
  .link i {
    width: 2px;
    height: 16px;
    background: var(--copper);
    border-radius: 1px;
  }
  .link span {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--blue);
  }

  .add {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 48px;
    padding: 0 10px;
    border-radius: 12px;
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
  }
  .plus {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--blue);
    color: var(--blue);
    display: grid;
    place-items: center;
    font-size: 20px;
    line-height: 1;
    font-weight: 500;
  }

  .stage {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 456px;
    grid-template-rows: auto minmax(0, 1fr);
  }
  .mast { grid-column: 1 / -1; padding: 20px 40px 0; }
  .workbench {
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 18px 36px 28px 40px;
  }
  .face-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .kicker {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--copper);
  }
  .actions { display: flex; align-items: center; gap: 6px; }
  .danger, .done { min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; }
  .danger { color: var(--danger); }
  .done {
    padding: 0 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: var(--raised);
  }

  .mast h2 {
    margin-top: 4px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 92px;
    line-height: 0.84;
    letter-spacing: 0.015em;
    text-transform: uppercase;
  }
  .rx {
    margin-top: 12px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 32px;
    line-height: 1;
    letter-spacing: 0.03em;
    color: var(--blue);
  }
  .note {
    margin-top: 12px;
    max-width: 42ch;
    color: rgba(255, 255, 255, 0.78);
    font-size: 14px;
  }
  .mast .tempo { margin: 16px 0 18px; }

  .sets {
    flex: 1;
    margin-top: 4px;
    display: grid;
    grid-template-columns: 32px 120px 140px;
    column-gap: 42px;
    align-items: center;
    align-content: space-evenly;
    justify-content: start;
  }
  .sets .h {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--blue);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 28px;
  }
  .sets .h svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2; }
  .idx {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
  }
  .slot {
    height: 68px;
    display: flex;
    align-items: center;
  }
  .num {
    font-family: var(--display);
    font-weight: 600;
    font-size: 44px;
    line-height: 1;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  .plate {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--copper);
    box-shadow: inset 0 0 0 5px #000, inset 0 0 0 6.5px var(--copper);
  }
  .plate .num { font-size: 40px; }

  .tools {
    display: flex;
    justify-content: flex-end;
    padding-top: 8px;
  }
  .tempo-digits {
    display: flex;
    gap: 28px;
  }
  .tempo-digits div { min-width: 64px; }
  .tempo-digits strong {
    display: block;
    font-family: var(--display);
    font-size: 40px;
    font-weight: 600;
    line-height: 0.9;
    letter-spacing: 0.02em;
  }
  .tempo-digits strong.fast { color: var(--blue); }
  .tempo-digits span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.01em;
  }
  .set-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .step {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1.5px solid var(--blue);
    color: var(--blue);
    font-size: 24px;
    line-height: 1;
    display: grid;
    place-items: center;
  }
  .stepper em {
    font-style: normal;
    font-family: var(--display);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .amrap {
    min-height: 36px;
    color: var(--blue);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .dock {
    grid-column: 2;
    grid-row: 2;
    min-height: 0;
    display: flex;
    align-items: center;
    background: #141414;
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
    border-radius: 28px 0 0 0;
    padding: 28px 32px;
  }
  .pad { width: 100%; }
  .pad-top {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    min-height: 52px;
    margin-bottom: 12px;
  }
  .pad-val {
    font-family: var(--display);
    font-weight: 500;
    font-size: 56px;
    line-height: 0.85;
    letter-spacing: -0.01em;
  }
  .caret {
    display: inline-block;
    width: 2px;
    height: 0.72em;
    margin-left: 3px;
    background: var(--blue);
    vertical-align: -0.04em;
  }
  .pad-unit {
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.16em;
  }
  .pad-close {
    margin-left: auto;
    width: 44px;
    height: 44px;
    color: #fff;
    font-size: 26px;
    line-height: 1;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 60px);
    gap: 14px 8px;
    justify-items: center;
  }
  .key {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.92);
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
  }
  .key.bs { border-radius: 14px; }
  .key.bs svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .key.c4 { grid-column: 4; }
  .key.r1 { grid-row: 1; }
  .key.r2 { grid-row: 2; }
  .key.r3 { grid-row: 3; }
  .key.r4 { grid-row: 4; }
  .key.c1 { grid-column: 1; }
  .key.c2 { grid-column: 2; }
  .key.c3 { grid-column: 3; }

  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    .rail { display: none; }
    .desk { grid-template-columns: 1fr; }
    .spine { display: none; }
    .stage { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    .mast, .dock { grid-column: 1; grid-row: auto; }
    .mast { padding: 16px 16px 0; }
    .workbench { padding: 12px 16px 16px; }
    .mast h2 { font-size: 64px; }
    .dock { border-radius: 22px 22px 0 0; border-left: 0; }
    .rx { font-size: 26px; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Coach">
      <div class="mark" aria-hidden="true">AB</div>
      <button type="button" aria-label="Athletes">
        <svg viewBox="0 0 24 24"><path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1"/><circle cx="9" cy="7" r="3"/><path d="M22 19v-1a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
      <button type="button" class="on" aria-label="Library" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
      </button>
      <button type="button" aria-label="Assign">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-6"/></svg>
      </button>
      <button type="button" class="foot" aria-label="Account">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 19a7 7 0 0 1 14 0"/></svg>
      </button>
    </aside>

    <div class="work">
      <header class="header">
        <h1>Lower Strength</h1>
        <div class="header-actions">
          <span class="who">Demo coach</span>
          <button type="button" class="next">Next</button>
        </div>
      </header>

      <div class="desk">
        <nav class="spine" aria-label="Exercises">
          <p class="spine-kicker">Exercises</p>

          <button type="button" class="lift is-on" aria-current="true">
            <span class="disc">A</span>
            <span><b>Back Squat</b><small>4 × 5 · 80 kg · 31X1</small></span>
          </button>

          <div class="pair">
            <button type="button" class="lift">
              <span class="disc pair-disc">B1</span>
              <span><b>Bench Press</b><small>3 × 8 · 60 kg</small></span>
            </button>
            <div class="link" aria-hidden="true"><i></i><span>Superset</span></div>
            <button type="button" class="lift">
              <span class="disc pair-disc">B2</span>
              <span><b>Barbell Row</b><small>3 × 8 · 70 kg</small></span>
            </button>
          </div>

          <button type="button" class="lift">
            <span class="disc">C</span>
            <span><b>Romanian Deadlift</b><small>3 × 8 / AMRAP · 100 kg</small></span>
          </button>

          <button type="button" class="add"><span class="plus" aria-hidden="true">+</span> Exercise</button>
        </nav>

        <main class="stage">
          <section class="mast" aria-label="Back Squat">
            <div class="face-top">
              <p class="kicker">A · Strength</p>
              <div class="actions">
                <button type="button" class="danger">Delete</button>
                <button type="button" class="done">Done</button>
              </div>
            </div>
            <h2>Back Squat</h2>
            <p class="rx">4 × 5 · 80 kg · 31X1</p>
            <p class="note">Brace before the descent. Last set stays a hard 5.</p>
            <div class="tempo" aria-label="Tempo 3 1 X 1">
              <div class="tempo-digits">
                <div><strong>3</strong><span>way down</span></div>
                <div><strong>1</strong><span>bottom</span></div>
                <div><strong class="fast">X</strong><span>fast</span></div>
                <div><strong>1</strong><span>top</span></div>
              </div>
            </div>
          </section>

          <section class="workbench">
            <div class="sets" role="table" aria-label="Sets">
              <span></span>
              <span class="h">Reps <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg></span>
              <span class="h">Kg <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg></span>

              <span class="idx">1</span>
              <span class="slot"><span class="num">5</span></span>
              <span class="slot"><span class="num">80</span></span>

              <span class="idx">2</span>
              <span class="slot"><span class="num">5</span></span>
              <span class="slot"><span class="num">80</span></span>

              <span class="idx">3</span>
              <span class="slot"><span class="plate" aria-current="true"><span class="num">5</span></span></span>
              <span class="slot"><span class="num">82.5</span></span>

              <span class="idx">4</span>
              <span class="slot"><span class="num">5</span></span>
              <span class="slot"><span class="num">80</span></span>
            </div>

            <div class="tools">
              <div class="set-tools">
                <div class="stepper" aria-label="4 sets">
                  <button type="button" class="step" aria-label="Remove a set">−</button>
                  <em>4 sets</em>
                  <button type="button" class="step" aria-label="Add a set">+</button>
                </div>
                <button type="button" class="amrap">Add final AMRAP</button>
              </div>
            </div>
          </section>

          <div class="dock" role="dialog" aria-label="Reps keypad">
            <div class="pad">
              <div class="pad-top">
                <div class="pad-val" aria-live="polite">5<span class="caret" aria-hidden="true"></span></div>
                <span class="pad-unit">REPS</span>
                <button type="button" class="pad-close" aria-label="Close keypad">⌄</button>
              </div>
              <div class="keys">
                <button type="button" class="key c1 r1">1</button>
                <button type="button" class="key c2 r1">2</button>
                <button type="button" class="key c3 r1">3</button>
                <button type="button" class="key c4 r1" aria-label="Next">&gt;</button>
                <button type="button" class="key c1 r2">4</button>
                <button type="button" class="key c2 r2">5</button>
                <button type="button" class="key c3 r2">6</button>
                <button type="button" class="key c4 r2" aria-label="Previous">&lt;</button>
                <button type="button" class="key c1 r3">7</button>
                <button type="button" class="key c2 r3">8</button>
                <button type="button" class="key c3 r3">9</button>
                <button type="button" class="key c1 r4" aria-label="Range">–</button>
                <button type="button" class="key c2 r4">0</button>
                <button type="button" class="key c3 r4 bs" aria-label="Delete">
                  <svg viewBox="0 0 24 24"><path d="M9 9l6 6M15 9l-6 6"/><path d="M21 6H9l-6 6 6 6h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/></svg>
                </button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
